name: Ошибка
description: Что-то работает не так, как ожидалось
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке. Об уязвимости пишите закрыто — см. SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали увидеть и что произошло на самом деле.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Открыть папку …
        2. Выполнить команду …
        3. Увидеть …
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Версия
      description: Скопируйте текст из «Справка → О программе» (Ctrl+C в окне сведений).
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: |
        Если есть ошибка в журнале, приложите нужный фрагмент: «Разработчик: Открыть журнал» в палитре команд.
        Уберите из него пути и данные, которые не хотите публиковать.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Дополнительно
      description: Скриншоты, модель агента, размер папки и всё, что поможет разобраться.
